[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aastrika-telemetry"
version = "0.1.0"
description = "ETL pipeline for Elasticsearch to PostgreSQL data migration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "elasticsearch>=8.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aastrika_telemetry"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[project.scripts]
aastrika-telemetry = "aastrika_telemetry.__main__:main"